NAME: Ego3DLM_stage1_scene_pretrain # Experiment names
ACCELERATOR: 'gpu' # Devices optioncal: “cpu”, “gpu”, “tpu”, “ipu”, “hpu”, “mps, “auto”
NUM_NODES: 1 # Number of GPU nodes for distributed training
DEVICE: [0] # Index of gpus eg. [0] or [0,1,2,3]

TRAIN:
  STAGE: lm_pretrain # Stage I: semantic and spatial scene QA
  NUM_WORKERS: 16 # Number of workers
  BATCH_SIZE: 16 # Size of batches
  GRADIENT_ACCUMULATION_STEP: 1
  END_EPOCH: 999999 # End epoch
  RESUME: '' # Resume training from this path
  PRETRAINED: '' # Preatrained model path
  PRETRAINED_VAE: checkpoints/ego3dlm/stage0_pqvae.ckpt # Stage 0 PQ-VAE checkpoint

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0

# Evaluating Configuration
EVAL:
  BATCH_SIZE: 4 # Evaluating Batch size
  SPLIT: test

DATASET:
  target: ego3dlm.data.lm_datamodule.LMDataModule
  CODE_PATH: TOKENS
  MIN_MOTION_LEN: 45
  NUM_3D_POINTS: 10000
  NYMERIA:
    OBSTACLE_LABELS_PATH: obstacle_labels

METRIC:
  TYPE: ['T2TMetrics', 'ObstacleMetrics']

LOSS:
  LAMBDA_CLS: 1.0

model:
  target: ego3dlm.models.ego3dlm.Ego3DLM
  params:
    num_query_token: 32
    task: 'sceneqa_obstacleqa'
    lm: ${lm.gpt2_medium}
    motion_vae: ${vq.pqvae}
    task_probs: [4, 1] # sceneqa : obstacleqa sampling ratio

LOGGER:
  TYPE: ['tensorboard', 'wandb']
  VAL_EVERY_STEPS: 1
  CKPT_EVERY_EPOCHS: 10
  SAVE_TOP_K: 0
  WANDB:
    params:
      project: ego3dlm
