NAME: Ego3DLM_stage0_pqvae # Experiment names
ACCELERATOR: 'gpu' # Devices optioncal: “cpu”, “gpu”, “tpu”, “ipu”, “hpu”, “mps, “auto”
NUM_NODES: 1 # Number of GPU nodes for distributed training
DEVICE: [0] # Index of gpus eg. [0] or [0,1,2,3]

TRAIN:
  STAGE: vae # Stage 0: motion PQ-VAE
  NUM_WORKERS: 16 # Number of workers
  BATCH_SIZE: 256 # Size of batches
  END_EPOCH: 999999 # End epoch
  RESUME: '' # Resume training from this path
  PRETRAINED: '' # Preatrained model path

  OPTIM:
    target: AdamW
    params:
      lr: 2e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0

# Evaluating Configuration
EVAL:
  BATCH_SIZE: 32 # Evaluating Batch size
  SPLIT: test

DATASET:
  target: ego3dlm.data.motion_datamodule.MotionDataModule
  MIN_MOTION_LEN: 5

METRIC:
  TYPE: ['MRMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.5
  LAMBDA_COMMIT: 0.02

model:
  target: ego3dlm.models.motion_tokenizer.MotionTokenizer
  params:
    motion_vae: ${vq.pqvae}

LOGGER:
  TYPE: ['tensorboard', 'wandb']
  VAL_EVERY_STEPS: 10
  SAVE_TOP_K: 0
  WANDB:
    params:
      project: ego3dlm
