text_encoder:
  target: ego3dlm.archs.evaluator.TextEncoderBiGRUCo
  params:
    word_size: 300
    pos_size: 15
    hidden_size: 512
    output_size: 512
movement_encoder:
  target: ego3dlm.archs.evaluator.MovementConvEncoder
  params:
    input_size: ${eval:${DATASET.NFEATS} - 4}
    hidden_size: 512
    output_size: 512
motion_encoder:
  target: ego3dlm.archs.evaluator.MotionEncoderBiGRUCo
  params:
    input_size: ${evaluator.text_motion.movement_encoder.params.output_size}
    hidden_size: 1024
    output_size: 512
